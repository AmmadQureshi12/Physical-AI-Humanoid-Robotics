<!-- End-to-End System Diagram -->
<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <title>End-to-End Humanoid System Architecture</title>
  <desc>Diagram showing the complete autonomous humanoid system architecture</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="600" y="30" font-family="Arial" font-size="20" text-anchor="middle" fill="#000000">
    End-to-End Humanoid System Architecture
  </text>
  
  <!-- User Interaction -->
  <g transform="translate(50, 100)">
    <circle cx="60" cy="40" r="40" fill="#e0e0e0" stroke="#000000" stroke-width="2"/>
    <text x="60" y="45" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">User</text>
    <text x="60" y="60" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">(Voice)</text>
  </g>
  
  <!-- VLA System -->
  <g transform="translate(200, 80)">
    <rect x="0" y="0" width="160" height="80" fill="#a0c0e0" stroke="#000000" stroke-width="2" rx="10"/>
    <text x="80" y="25" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">VLA System</text>
    <text x="80" y="40" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">(Voice, Language, Vision)</text>
    <text x="80" y="55" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">Command Processing</text>
  </g>
  
  <!-- Cognitive Planner -->
  <g transform="translate(400, 80)">
    <rect x="0" y="0" width="160" height="80" fill="#c0e0a0" stroke="#000000" stroke-width="2" rx="10"/>
    <text x="80" y="30" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">Cognitive</text>
    <text x="80" y="45" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">Planner</text>
    <text x="80" y="60" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">(Task Decomposition)</text>
  </g>
  
  <!-- Behavior Engine -->
  <g transform="translate(600, 80)">
    <rect x="0" y="0" width="160" height="80" fill="#e0a0e0" stroke="#000000" stroke-width="2" rx="10"/>
    <text x="80" y="30" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">Behavior</text>
    <text x="80" y="45" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">Engine</text>
    <text x="80" y="60" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">(Action Sequencing)</text>
  </g>
  
  <!-- World Model -->
  <g transform="translate(800, 80)">
    <rect x="0" y="0" width="160" height="80" fill="#a0e0c0" stroke="#000000" stroke-width="2" rx="10"/>
    <text x="80" y="30" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">World</text>
    <text x="80" y="45" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">Model</text>
    <text x="80" y="60" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">(Environment Map)</text>
  </g>
  
  <!-- Perception System -->
  <g transform="translate(200, 200)">
    <rect x="0" y="0" width="160" height="80" fill="#e0a0a0" stroke="#000000" stroke-width="2" rx="10"/>
    <text x="80" y="25" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">Perception</text>
    <text x="80" y="40" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">System</text>
    <text x="80" y="55" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">(Vision, Sensors)</text>
  </g>
  
  <!-- Navigation System -->
  <g transform="translate(400, 200)">
    <rect x="0" y="0" width="160" height="80" fill="#d0d0e0" stroke="#000000" stroke-width="2" rx="10"/>
    <text x="80" y="25" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">Navigation</text>
    <text x="80" y="40" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">System</text>
    <text x="80" y="55" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">(Nav2, Path Planning)</text>
  </g>
  
  <!-- Manipulation System -->
  <g transform="translate(600, 200)">
    <rect x="0" y="0" width="160" height="80" fill="#e0d0a0" stroke="#000000" stroke-width="2" rx="10"/>
    <text x="80" y="25" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">Manipulation</text>
    <text x="80" y="40" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">System</text>
    <text x="80" y="55" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">(MoveIt, Grasping)</text>
  </g>
  
  <!-- Control System -->
  <g transform="translate(800, 200)">
    <rect x="0" y="0" width="160" height="80" fill="#a0d0d0" stroke="#000000" stroke-width="2" rx="10"/>
    <text x="80" y="25" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">Control</text>
    <text x="80" y="40" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">System</text>
    <text x="80" y="55" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">(Motion Control)</text>
  </g>
  
  <!-- Hardware Interface -->
  <g transform="translate(1000, 300)">
    <rect x="0" y="0" width="160" height="100" fill="#d0d0d0" stroke="#000000" stroke-width="2" rx="10"/>
    <text x="80" y="30" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">Hardware</text>
    <text x="80" y="45" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">Interface</text>
    <text x="80" y="60" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">(Actuators,</text>
    <text x="80" y="75" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">Sensors, Drivers)</text>
  </g>
  
  <!-- Humanoid Robot -->
  <g transform="translate(1000, 450)">
    <rect x="0" y="0" width="160" height="100" fill="#c0c0c0" stroke="#000000" stroke-width="2" rx="10"/>
    <text x="80" y="40" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">Humanoid</text>
    <text x="80" y="55" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">Robot</text>
    <text x="80" y="70" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">(Physical)</text>
  </g>
  
  <!-- Simulation Environment -->
  <g transform="translate(1000, 150)">
    <rect x="0" y="0" width="160" height="100" fill="#e0e0e0" stroke="#000000" stroke-width="2" rx="10"/>
    <text x="80" y="30" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">Simulation</text>
    <text x="80" y="45" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">Environment</text>
    <text x="80" y="60" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">(Gazebo/Unity)</text>
    <text x="80" y="75" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">Simulated Robot</text>
  </g>
  
  <!-- Feedback Loop -->
  <g transform="translate(200, 550)">
    <rect x="0" y="0" width="600" height="80" fill="#e0e0a0" stroke="#000000" stroke-width="2" rx="10"/>
    <text x="300" y="25" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">Feedback Loop</text>
    <text x="300" y="40" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">(State Estimation, Execution Monitoring,</text>
    <text x="300" y="55" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">Performance Metrics, Error Detection)</text>
  </g>
  
  <!-- Arrows -->
  <line x1="90" y1="140" x2="200" y2="120" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="360" y1="120" x2="400" y2="120" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="560" y1="120" x2="600" y2="120" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="120" x2="800" y2="120" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="280" y1="160" x2="280" y2="200" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="160" x2="480" y2="200" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="160" x2="680" y2="200" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="880" y1="160" x2="880" y2="200" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="960" y1="120" x2="1000" y2="200" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="960" y1="350" x2="1000" y2="350" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1080" y1="400" x2="1080" y2="450" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1080" y1="550" x2="1080" y2="500" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <line x1="1000" y1="500" x2="880" y2="280" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <line x1="880" y1="280" x2="880" y2="590" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <line x1="880" y1="590" x2="800" y2="590" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <line x1="800" y1="590" x2="800" y2="550" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <line x1="800" y1="550" x2="720" y2="590" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <line x1="720" y1="590" x2="640" y2="590" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <line x1="640" y1="590" x2="640" y2="550" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <line x1="640" y1="550" x2="560" y2="590" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <line x1="560" y1="590" x2="480" y2="590" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <line x1="480" y1="590" x2="480" y2="550" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <line x1="480" y1="550" x2="400" y2="590" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <line x1="400" y1="590" x2="320" y2="590" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <line x1="320" y1="590" x2="320" y2="550" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <line x1="320" y1="550" x2="240" y2="590" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <line x1="240" y1="590" x2="200" y2="590" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <line x1="200" y1="590" x2="200" y2="550" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <line x1="200" y1="550" x2="100" y2="140" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000000" />
    </marker>
  </defs>
  
  <text x="100" y="630" font-family="Arial" font-size="12" fill="#000000">Environment</text>
  <text x="100" y="645" font-family="Arial" font-size="12" fill="#000000">Perception</text>
  <text x="500" y="680" font-family="Arial" font-size="12" fill="#000000">Execution Feedback Loop</text>
  <text x="500" y="695" font-family="Arial" font-size="12" fill="#000000">for State Estimation and Monitoring</text>
</svg>