<!-- Placeholder for service call diagram -->
<!-- This would typically be an SVG file showing service request/response pattern -->
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <title>Service Call Diagram</title>
  <desc>Diagram showing service request/response pattern in ROS 2</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="400" y="30" font-family="Arial" font-size="20" text-anchor="middle" fill="#000000">
    Service Request/Response Pattern
  </text>
  <g transform="translate(150, 150)">
    <circle cx="50" cy="50" r="40" fill="#a0c0e0" stroke="#000000" stroke-width="2"/>
    <text x="50" y="55" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">Client</text>
    <text x="50" y="70" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">Node A</text>
  </g>
  <g transform="translate(150, 350)">
    <circle cx="50" cy="50" r="40" fill="#e0a0a0" stroke="#000000" stroke-width="2"/>
    <text x="50" y="55" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">Service</text>
    <text x="50" y="70" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">Node B</text>
  </g>
  <g transform="translate(450, 250)">
    <rect x="0" y="0" width="120" height="60" fill="#c0e0e0" stroke="#000000" stroke-width="2" rx="10"/>
    <text x="60" y="35" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">Service</text>
    <text x="60" y="50" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">/robot/move_joint</text>
  </g>
  <line x1="200" y1="200" x2="450" y2="270" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <text x="325" y="230" font-family="Arial" font-size="12" fill="#000000">Request</text>
  <line x1="450" y1="310" x2="200" y2="400" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="325" y="370" font-family="Arial" font-size="12" fill="#000000">Response</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000000" />
    </marker>
  </defs>
</svg>