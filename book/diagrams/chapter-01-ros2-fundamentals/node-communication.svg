<!-- Placeholder for node communication diagram -->
<!-- This would typically be an SVG file showing node communication patterns -->
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <title>Node Communication Diagram</title>
  <desc>Diagram showing node communication via topics in ROS 2</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="400" y="30" font-family="Arial" font-size="20" text-anchor="middle" fill="#000000">
    Node Communication via Topics
  </text>
  <g transform="translate(100, 100)">
    <circle cx="50" cy="50" r="40" fill="#a0c0e0" stroke="#000000" stroke-width="2"/>
    <text x="50" y="55" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">Publisher</text>
    <text x="50" y="70" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">Node A</text>
  </g>
  <g transform="translate(300, 250)">
    <ellipse cx="50" cy="30" rx="60" ry="30" fill="#c0e0a0" stroke="#000000" stroke-width="2"/>
    <text x="50" y="35" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">Topic</text>
    <text x="50" y="50" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">/robot/joint_states</text>
  </g>
  <g transform="translate(500, 100)">
    <circle cx="50" cy="50" r="40" fill="#e0a0a0" stroke="#000000" stroke-width="2"/>
    <text x="50" y="55" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">Subscriber</text>
    <text x="50" y="70" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">Node B</text>
  </g>
  <g transform="translate(500, 300)">
    <circle cx="50" cy="50" r="40" fill="#e0a0a0" stroke="#000000" stroke-width="2"/>
    <text x="50" y="55" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">Subscriber</text>
    <text x="50" y="70" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">Node C</text>
  </g>
  <line x1="190" y1="150" x2="300" y2="250" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="280" x2="500" y2="150" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="280" x2="500" y2="350" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000000" />
    </marker>
  </defs>
</svg>