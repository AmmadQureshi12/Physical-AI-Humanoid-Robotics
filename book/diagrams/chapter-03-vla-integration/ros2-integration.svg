<!-- ROS 2 Integration Diagram -->
<svg width="1000" height="600" xmlns="http://www.w3.org/2000/svg">
  <title>ROS 2 Integration in VLA Systems</title>
  <desc>Diagram showing how VLA systems integrate with ROS 2 infrastructure</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="500" y="30" font-family="Arial" font-size="20" text-anchor="middle" fill="#000000">
    ROS 2 Integration in VLA Systems
  </text>
  
  <!-- VLA Core Components -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="200" height="160" fill="#e0e0e0" stroke="#000000" stroke-width="2" rx="10"/>
    <text x="100" y="25" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">VLA Core</text>
    
    <!-- Whisper Component -->
    <g transform="translate(20, 40)">
      <rect x="0" y="0" width="160" height="40" fill="#c0e0a0" stroke="#000000" stroke-width="1" rx="5"/>
      <text x="80" y="25" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">Whisper (ASR)</text>
    </g>
    
    <!-- LLM Component -->
    <g transform="translate(20, 90)">
      <rect x="0" y="0" width="160" height="40" fill="#a0c0e0" stroke="#000000" stroke-width="1" rx="5"/>
      <text x="80" y="25" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">LLM (Cognitive Planning)</text>
    </g>
  </g>
  
  <!-- Vision Processing -->
  <g transform="translate(300, 100)">
    <rect x="0" y="0" width="160" height="160" fill="#e0e0e0" stroke="#000000" stroke-width="2" rx="10"/>
    <text x="80" y="25" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">Vision Processing</text>
    
    <!-- Camera Input -->
    <g transform="translate(20, 40)">
      <rect x="0" y="0" width="120" height="40" fill="#e0a0a0" stroke="#000000" stroke-width="1" rx="5"/>
      <text x="60" y="25" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">Camera Input</text>
    </g>
    
    <!-- Vision Grounding -->
    <g transform="translate(20, 90)">
      <rect x="0" y="0" width="120" height="40" fill="#e0a0e0" stroke="#000000" stroke-width="1" rx="5"/>
      <text x="60" y="25" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">Vision Grounding</text>
    </g>
  </g>
  
  <!-- VLA Pipeline Integration -->
  <g transform="translate(510, 100)">
    <rect x="0" y="0" width="160" height="160" fill="#e0e0e0" stroke="#000000" stroke-width="2" rx="10"/>
    <text x="80" y="25" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">VLA Pipeline</text>
    
    <!-- Fusion Module -->
    <g transform="translate(20, 40)">
      <rect x="0" y="0" width="120" height="40" fill="#a0e0c0" stroke="#000000" stroke-width="1" rx="5"/>
      <text x="60" y="25" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">Vision-Language Fusion</text>
    </g>
    
    <!-- Task Planner -->
    <g transform="translate(20, 90)">
      <rect x="0" y="0" width="120" height="40" fill="#a0d0e0" stroke="#000000" stroke-width="1" rx="5"/>
      <text x="60" y="25" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">Task Planner</text>
    </g>
  </g>
  
  <!-- ROS 2 Action Servers -->
  <g transform="translate(720, 100)">
    <rect x="0" y="0" width="200" height="160" fill="#e0e0e0" stroke="#000000" stroke-width="2" rx="10"/>
    <text x="100" y="25" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">ROS 2 Action Servers</text>
    
    <!-- Navigation Server -->
    <g transform="translate(20, 40)">
      <rect x="0" y="0" width="160" height="30" fill="#d0d0e0" stroke="#000000" stroke-width="1" rx="5"/>
      <text x="80" y="20" font-family="Arial" font-size="10" text-anchor="middle" fill="#000000">Navigation Action Server</text>
    </g>
    
    <!-- Manipulation Server -->
    <g transform="translate(20, 80)">
      <rect x="0" y="0" width="160" height="30" fill="#d0d0e0" stroke="#000000" stroke-width="1" rx="5"/>
      <text x="80" y="20" font-family="Arial" font-size="10" text-anchor="middle" fill="#000000">Manipulation Action Server</text>
    </g>
    
    <!-- Locomotion Server -->
    <g transform="translate(20, 120)">
      <rect x="0" y="0" width="160" height="30" fill="#d0d0e0" stroke="#000000" stroke-width="1" rx="5"/>
      <text x="80" y="20" font-family="Arial" font-size="10" text-anchor="middle" fill="#000000">Locomotion Action Server</text>
    </g>
  </g>
  
  <!-- Robot Platform -->
  <g transform="translate(400, 320)">
    <rect x="0" y="0" width="200" height="100" fill="#d0d0d0" stroke="#000000" stroke-width="2" rx="10"/>
    <text x="100" y="25" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">Robot Platform</text>
    
    <!-- Navigation Component -->
    <g transform="translate(20, 40)">
      <rect x="0" y="0" width="50" height="40" fill="#c0e0a0" stroke="#000000" stroke-width="1" rx="5"/>
      <text x="25" y="20" font-family="Arial" font-size="8" text-anchor="middle" fill="#000000">Nav</text>
    </g>
    
    <!-- Manipulation Component -->
    <g transform="translate(80, 40)">
      <rect x="0" y="0" width="50" height="40" fill="#a0c0e0" stroke="#000000" stroke-width="1" rx="5"/>
      <text x="25" y="20" font-family="Arial" font-size="8" text-anchor="middle" fill="#000000">Manip</text>
    </g>
    
    <!-- Locomotion Component -->
    <g transform="translate(140, 40)">
      <rect x="0" y="0" width="50" height="40" fill="#e0a0e0" stroke="#000000" stroke-width="1" rx="5"/>
      <text x="25" y="20" font-family="Arial" font-size="8" text-anchor="middle" fill="#000000">Locom</text>
    </g>
  </g>
  
  <!-- ROS 2 Middleware -->
  <g transform="translate(50, 350)">
    <rect x="0" y="0" width="160" height="60" fill="#a0e0c0" stroke="#000000" stroke-width="2" rx="10"/>
    <text x="80" y="25" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">ROS 2 Middleware</text>
    <text x="80" y="40" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">(DDS Implementation)</text>
  </g>
  
  <!-- DDS Communication -->
  <g transform="translate(250, 350)">
    <rect x="0" y="0" width="160" height="60" fill="#a0d0e0" stroke="#000000" stroke-width="2" rx="10"/>
    <text x="80" y="25" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">DDS Communication</text>
    <text x="80" y="40" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">(Topics & Services)</text>
  </g>
  
  <!-- QoS Configuration -->
  <g transform="translate(450, 350)">
    <rect x="0" y="0" width="160" height="60" fill="#d0a0d0" stroke="#000000" stroke-width="2" rx="10"/>
    <text x="80" y="25" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">QoS Configuration</text>
    <text x="80" y="40" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">(Reliability, Durability)</text>
  </g>
  
  <!-- Status & Feedback -->
  <g transform="translate(650, 350)">
    <rect x="0" y="0" width="160" height="60" fill="#e0e0a0" stroke="#000000" stroke-width="2" rx="10"/>
    <text x="80" y="25" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">Status & Feedback</text>
    <text x="80" y="40" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">(Action Results, State)</text>
  </g>
  
  <!-- Arrows -->
  <line x1="250" y1="180" x2="300" y2="180" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="460" y1="180" x2="510" y2="180" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="670" y1="180" x2="720" y2="180" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="820" y1="260" x2="820" y2="320" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="130" y1="260" x2="130" y2="350" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="330" y1="260" x2="500" y2="350" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="530" y1="260" x2="500" y2="350" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <line x1="210" y1="380" x2="250" y2="380" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="380" x2="450" y2="380" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="610" y1="380" x2="650" y2="380" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="730" y1="410" x2="600" y2="450" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <line x1="600" y1="450" x2="600" y2="320" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <line x1="600" y1="320" x2="720" y2="260" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <line x1="500" y1="410" x2="500" y2="450" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <line x1="500" y1="450" x2="450" y2="450" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <line x1="450" y1="450" x2="450" y2="410" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000000" />
    </marker>
  </defs>
  
  <text x="500" y="480" font-family="Arial" font-size="12" fill="#000000">Bidirectional Communication</text>
  <text x="500" y="495" font-family="Arial" font-size="12" fill="#000000">for Action Execution & Monitoring</text>
</svg>