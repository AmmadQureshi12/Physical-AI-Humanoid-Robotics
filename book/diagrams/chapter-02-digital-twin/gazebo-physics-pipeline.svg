<!-- Gazebo Physics Pipeline Diagram -->
<svg width="900" height="600" xmlns="http://www.w3.org/2000/svg">
  <title>Gazebo Physics Pipeline</title>
  <desc>Diagram showing the physics simulation pipeline in Gazebo</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="450" y="30" font-family="Arial" font-size="20" text-anchor="middle" fill="#000000">
    Gazebo Physics Pipeline
  </text>
  
  <!-- World Definition -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="160" height="60" fill="#e0e0e0" stroke="#000000" stroke-width="2" rx="10"/>
    <text x="80" y="35" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">World Definition</text>
    <text x="80" y="50" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">(SDF/XML)</text>
  </g>
  
  <!-- Physics Engine -->
  <g transform="translate(250, 100)">
    <rect x="0" y="0" width="160" height="60" fill="#c0e0a0" stroke="#000000" stroke-width="2" rx="10"/>
    <text x="80" y="30" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">Physics Engine</text>
    <text x="80" y="45" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">(ODE, Bullet, etc.)</text>
  </g>
  
  <!-- Collision Detection -->
  <g transform="translate(450, 100)">
    <rect x="0" y="0" width="160" height="60" fill="#a0c0e0" stroke="#000000" stroke-width="2" rx="10"/>
    <text x="80" y="25" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">Collision</text>
    <text x="80" y="40" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">Detection</text>
    <text x="80" y="55" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">& Response</text>
  </g>
  
  <!-- Sensor Simulation -->
  <g transform="translate(250, 220)">
    <rect x="0" y="0" width="160" height="60" fill="#e0a0e0" stroke="#000000" stroke-width="2" rx="10"/>
    <text x="80" y="30" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">Sensor Simulation</text>
    <text x="80" y="45" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">(Cameras, LiDAR, etc.)</text>
  </g>
  
  <!-- Visualization -->
  <g transform="translate(50, 220)">
    <rect x="0" y="0" width="160" height="60" fill="#e0e0a0" stroke="#000000" stroke-width="2" rx="10"/>
    <text x="80" y="30" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">Visualization</text>
    <text x="80" y="45" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">(OGRE Rendering)</text>
  </g>
  
  <!-- ROS 2 Interface -->
  <g transform="translate(450, 220)">
    <rect x="0" y="0" width="160" height="60" fill="#a0e0c0" stroke="#000000" stroke-width="2" rx="10"/>
    <text x="80" y="30" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">ROS 2 Interface</text>
    <text x="80" y="45" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">(gazebo_ros_pkgs)</text>
  </g>
  
  <!-- Control Loop -->
  <g transform="translate(330, 350)">
    <rect x="0" y="0" width="160" height="60" fill="#e0a0a0" stroke="#000000" stroke-width="2" rx="10"/>
    <text x="80" y="25" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">Control</text>
    <text x="80" y="40" font-family="Arial" font-size="14" text-anchor="middle" fill="#000000">Loop</text>
    <text x="80" y="55" font-family="Arial" font-size="12" text-anchor="middle" fill="#000000">(1000 Hz)</text>
  </g>
  
  <!-- Arrows showing flow -->
  <line x1="210" y1="130" x2="250" y2="130" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="130" x2="450" y2="130" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="130" y1="160" x2="130" y2="220" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="250" y1="160" x2="330" y2="220" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="160" x2="530" y2="220" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="530" y1="280" x2="530" y2="350" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="410" y1="380" x2="330" y2="410" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <line x1="330" y1="410" x2="210" y2="250" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  <line x1="210" y1="250" x2="250" y2="160" stroke="#000000" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow)"/>
  
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000000" />
    </marker>
  </defs>
  
  <text x="330" y="440" font-family="Arial" font-size="12" fill="#000000">Physics Update</text>
  <text x="150" y="280" font-family="Arial" font-size="12" fill="#000000">Visual Update</text>
  <text x="470" y="350" font-family="Arial" font-size="12" fill="#000000">Sensor Data</text>
  <text x="350" y="470" font-family="Arial" font-size="12" fill="#000000">ROS 2 Commands</text>
</svg>