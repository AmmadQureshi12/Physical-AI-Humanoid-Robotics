<!-- Placeholder for ROS 2 architecture diagram -->
<!-- This would typically be an SVG file showing the ROS 2 architecture -->
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <title>ROS 2 Architecture Diagram</title>
  <desc>Diagram showing ROS 2 architecture with nodes, topics, services, and actions</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="400" y="30" font-family="Arial" font-size="20" text-anchor="middle" fill="#000000">
    ROS 2 Architecture Diagram
  </text>
  <g transform="translate(100, 100)">
    <rect x="0" y="0" width="200" height="100" fill="#e0e0e0" stroke="#000000" stroke-width="2" rx="10"/>
    <text x="100" y="50" font-family="Arial" font-size="16" text-anchor="middle" fill="#000000" dominant-baseline="middle">
      ROS 2 Nodes
    </text>
  </g>
  <g transform="translate(500, 100)">
    <rect x="0" y="0" width="200" height="100" fill="#e0e0e0" stroke="#000000" stroke-width="2" rx="10"/>
    <text x="100" y="50" font-family="Arial" font-size="16" text-anchor="middle" fill="#000000" dominant-baseline="middle">
      DDS Middleware
    </text>
  </g>
  <g transform="translate(100, 300)">
    <rect x="0" y="0" width="200" height="100" fill="#e0e0e0" stroke="#000000" stroke-width="2" rx="10"/>
    <text x="100" y="50" font-family="Arial" font-size="16" text-anchor="middle" fill="#000000" dominant-baseline="middle">
      Topics & Messages
    </text>
  </g>
  <g transform="translate(500, 300)">
    <rect x="0" y="0" width="200" height="100" fill="#e0e0e0" stroke="#000000" stroke-width="2" rx="10"/>
    <text x="100" y="50" font-family="Arial" font-size="16" text-anchor="middle" fill="#000000" dominant-baseline="middle">
      Services & Actions
    </text>
  </g>
  <line x1="300" y1="150" x2="500" y2="150" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="200" y1="200" x2="200" y2="300" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="200" x2="600" y2="300" stroke="#000000" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#000000" />
    </marker>
  </defs>
</svg>